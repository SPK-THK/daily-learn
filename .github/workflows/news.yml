name: Update financial news

on:
  schedule:
    - cron: '7 * * * *' # 每小时第 7 分钟；GitHub 可能延迟几分钟
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch Eastmoney news
        run: node scripts/fetch-news.mjs
      - name: Commit when changed
        id: commit
        run: |
          if git diff --quiet -- news.json; then
            echo "news.json unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "chore: update financial news"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
